<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oradores Locais</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <section id="appScreen" class="screen">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🎙️</span>
        <h1>Oradores Locais</h1>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn btn-outline">← Voltar ao Calendário</a>
          <a href="historico-discursos.html" class="btn btn-outline">📋 Registros</a>
          <a href="discursos-especiais.html" class="btn btn-outline">⭐ Discursos Especiais</a>
        <a href="ajuda.html" class="btn btn-outline">❓ Ajuda</a>
        <button id="addLocalSpeakerBtn" class="btn btn-primary">+ Novo Orador</button>
        <button id="logoutBtn" class="btn btn-ghost">Sair</button>
      </div>
    </header>

    <main class="app-main">
      <div class="calendar-wrapper">
        <div id="localSpeakersList" class="local-speakers-grid"></div>
      </div>
    </main>
  </section>

  <!-- ===================== MODAL DE ORADOR LOCAL ===================== -->
  <div id="localSpeakerModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="localSpeakerModalTitle">Novo Orador</h2>
        <button id="closeLocalSpeakerModalBtn" class="modal-close">&times;</button>
      </div>

      <form id="localSpeakerForm" class="modal-body">
        <div class="input-group">
          <label for="localNome">Nome do Orador</label>
          <input type="text" id="localNome" placeholder="Ex: João da Silva" required>
        </div>

        <div class="input-group">
          <label for="localTelefone">Telefone de Contato</label>
          <input type="tel" id="localTelefone" placeholder="(99) 99999-9999">
        </div>

        <div class="input-group">
          <label>Temas e Números</label>
          <div id="temasList" class="temas-list"></div>
          <button type="button" id="addTemaBtn" class="btn btn-outline btn-block" style="margin-top:8px;">+ Adicionar tema</button>
        </div>

        <div class="input-group">
          <label>Cor de identificação</label>
          <div class="color-picker" id="localColorPicker">
            <button type="button" class="color-swatch" data-color="#4361ee" style="background:#4361ee" title="Azul"></button>
            <button type="button" class="color-swatch" data-color="#2ec4b6" style="background:#2ec4b6" title="Turquesa"></button>
            <button type="button" class="color-swatch" data-color="#e63946" style="background:#e63946" title="Vermelho"></button>
            <button type="button" class="color-swatch" data-color="#ff9f1c" style="background:#ff9f1c" title="Laranja"></button>
            <button type="button" class="color-swatch" data-color="#8338ec" style="background:#8338ec" title="Roxo"></button>
            <button type="button" class="color-swatch" data-color="#06d6a0" style="background:#06d6a0" title="Verde-água"></button>
            <button type="button" class="color-swatch" data-color="#ef476f" style="background:#ef476f" title="Rosa"></button>
            <button type="button" class="color-swatch" data-color="#ffd166" style="background:#ffd166" title="Amarelo"></button>
            <button type="button" class="color-swatch" data-color="#118ab2" style="background:#118ab2" title="Azul petróleo"></button>
            <button type="button" class="color-swatch" data-color="#06a77d" style="background:#06a77d" title="Verde"></button>
            <button type="button" class="color-swatch" data-color="#7209b7" style="background:#7209b7" title="Violeta"></button>
            <button type="button" class="color-swatch" data-color="#495057" style="background:#495057" title="Cinza"></button>
            <label class="custom-color-wrap" title="Cor personalizada">
              <input type="color" id="localCustomColor" value="#4361ee">
              <span>+</span>
            </label>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="deleteLocalSpeakerBtn" class="btn btn-danger hidden">Excluir</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== MODAL DETALHES / DESIGNAÇÃO ===================== -->
  <div id="localSpeakerDetailsModal" class="modal-overlay hidden">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 id="detailsSpeakerName">Detalhes do Orador</h2>
        <button id="closeDetailsModalBtn" class="modal-close">&times;</button>
      </div>

      <div class="modal-body">
        <p class="speaker-detail">📞 <span id="detailsPhone"></span></p>

        <div class="input-group">
          <label for="detailsTemasList">Temas cadastrados</label>
          <div id="detailsTemasList" class="local-speaker-temas"></div>
        </div>

        <hr class="section-divider">

        <h3 class="section-title">📅 Designar para discurso</h3>
        <div class="row-2">
          <div class="input-group">
            <label for="designacaoData">Data do discurso</label>
            <input type="date" id="designacaoData">
          </div>
          <div class="input-group">
            <label for="designacaoTema">Tema</label>
            <select id="designacaoTema"></select>
          </div>
        </div>
        <div class="input-group">
          <label for="designacaoCongregacao">Congregação (opcional)</label>
          <input type="text" id="designacaoCongregacao" placeholder="Ex: Congregação Central">
        </div>
        <button type="button" id="marcarDesignacaoBtn" class="btn btn-primary btn-block">✅ Marcar no Calendário (verde)</button>

        <hr class="section-divider">
        <h3 class="section-title">Designações marcadas</h3>
        <div id="designacoesExistentes" class="speakers-list"></div>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <p>*********jw.org**********</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="esbocos/esbocos.js"></script>
  <script src="js/businessRules.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/localSpeakers.js"></script>
</body>
</html>
